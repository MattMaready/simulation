; =============================================================================
; SplunkerViz engine configuration
; - Starts on the engine's empty Entry map; ASplunkerGameMode then spawns the
;   world (from the generated layout JSON), robot twin, lidar/map visualizers
;   and lighting, so the project needs NO binary .umap/.uasset files to run.
; - Lumen GI/reflections + virtual shadow maps for the realistic look.
; =============================================================================

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/SplunkerViz.SplunkerGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.Engine]
; Smooth the twin's motion; the bridge sends poses at 30 Hz and the robot interpolates.
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=30.000000),UpperBound=(Type=Exclusive,Value=120.000000))
